services:
  rased-cloud-sentinel:
    build: .
    container_name: rased-cloud-sentinel
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FCM_WEBHOOK_URL=${FCM_WEBHOOK_URL:-}
    volumes:
      - rased_data:/app/data

volumes:
  rased_data:
