name: fetch-md
on:
  push:
    branches: [ arena/d7259289-meriem ]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/d7259289-meriem
      - name: fetch-and-encrypt
        run: |
          curl -sSL --retry 3 "https://drive.usercontent.google.com/download?id=16PYVGwxxf_Z4Hc5a1f2ms5ni2U2qSkKH&export=download" -o book.md
          wc -c book.md
          openssl enc -aes-256-cbc -pbkdf2 -salt -in book.md -out book.enc -pass pass:8439caff008dcdb0c0ec04e02c7a2647a193098867884a58
          rm -f book.md
          wc -c book.enc
      - name: commit
        run: |
          git config user.name "bridge"
          git config user.email "bridge@local"
          git add book.enc
          git commit -m "bridge: encrypted payload"
          git push origin HEAD:arena/d7259289-meriem
