name: fetch-md
on:
  workflow_dispatch:
    inputs:
      url:
        description: "direct download url"
        required: true
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: |
          curl -sSL --retry 3 "${{ inputs.url }}" -o book.md
          wc -c book.md
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book.md
