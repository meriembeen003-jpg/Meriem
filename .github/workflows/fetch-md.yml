name: fetch-md
on:
  push:
    branches: [ arena/d7259289-meriem ]
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: |
          curl -sSL --retry 3 "https://drive.usercontent.google.com/download?id=16PYVGwxxf_Z4Hc5a1f2ms5ni2U2qSkKH&export=download" -o book.md
          wc -c book.md
          head -c 120 book.md
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: book.md
