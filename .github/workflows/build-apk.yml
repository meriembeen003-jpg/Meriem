name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/5db4bbb4-meriem

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo "Android API 36 and build tools are ready."

      - name: Install web dependencies
        run: npm ci

      - name: Export web app
        run: npm run build

      - name: Sync Android wrapper
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marsad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  stage-apk-for-drive-transfer:
    name: Stage one-time APK for Drive transfer
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[drive-apk]')
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: marsad-debug-apk
          path: apk-transfer

      - name: Stage APK briefly on the fixed branch
        run: |
          cp apk-transfer/app-debug.apk marsad-transfer.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marsad-transfer.apk
          git commit -m "Temporary APK transfer [skip ci]"
          git push
