name: Build Rased Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
    inputs:
      cloud_server_url:
        description: "رابط الخادم السحابي الدائم (اختياري)"
        required: false
        default: ""

permissions:
  contents: write
  statuses: write

jobs:
  build-android-apk:
    name: Compile Android APK (JDK 21 + SDK 36)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Verify Preinstalled Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          test -d "$SDK_ROOT/platforms/android-36"
          echo "Android SDK 36 verified at $SDK_ROOT"

      - name: Install NPM Dependencies & Sync Capacitor Android
        env:
          CAPACITOR_CLOUD_SERVER_URL: ${{ github.event.inputs.cloud_server_url || vars.CAPACITOR_CLOUD_SERVER_URL || '' }}
        run: |
          npm ci
          node scripts/prepare-apk-assets.mjs
          npx cap sync android

      - name: Build Installable Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Rased-GeoIntel-APK.apk

      - name: Upload Ready-to-Install Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rased-GeoIntel-APK
          path: Rased-GeoIntel-APK.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK Blob SHA for Cloud Drive Sync
        if: contains(github.event.head_commit.message, '[drive-apk]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import base64, json
          with open("Rased-GeoIntel-APK.apk", "rb") as f:
              b64 = base64.b64encode(f.read()).decode("ascii")
          with open("apk_blob_req.json", "w") as out:
              json.dump({"content": b64, "encoding": "base64"}, out)
          PY
          BLOB_SHA=$(gh api "repos/${{ github.repository }}/git/blobs" --method POST --input apk_blob_req.json --jq '.sha')
          rm -f apk_blob_req.json
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --method POST \
            -f state="success" \
            -f context="rased/apk-blob" \
            -f description="$BLOB_SHA"
